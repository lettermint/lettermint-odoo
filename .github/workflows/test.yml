name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  odoo:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['18', '19']
    steps:
      - uses: actions/checkout@v4
      - name: Test modules
        run: scripts/test.sh '${{ matrix.version }}'
      - name: Test removal
        run: scripts/test-lifecycle.sh '${{ matrix.version }}'
      - name: Set up business-flow database
        run: scripts/setup.sh '${{ matrix.version }}'
      - name: Test invoices, password resets, and replies
        run: scripts/test-business.sh '${{ matrix.version }}'
      - name: Stop services
        if: always()
        run: ODOO_MAJOR=${{ matrix.version }} docker compose down

  # The one check branch protection requires. It fails when a job above failed or
  # was cancelled; skipped jobs count as passed.
  ci:
    name: ci
    if: ${{ always() }}
    needs: [odoo]
    runs-on: ubuntu-slim
    steps:
      - name: Fail when a job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
