[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [".build"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"scripts/seed.py" = ["F821"]
"scripts/check_business_flows.py" = ["F821"]
"scripts/check_lifecycle.py" = ["F821"]
